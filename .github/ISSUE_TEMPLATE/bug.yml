name: Bug
description: Something that does not work the way it should.
title: "Bug - "
labels: ["type: task"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Include the error message if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Branch and file, if known.
