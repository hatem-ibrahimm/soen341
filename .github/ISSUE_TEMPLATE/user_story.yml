name: User story
description: Something a user can do, written from their point of view.
title: "S4 - US00 - "
labels: ["type: user-story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Who wants what, and why.
      value: "As a **[type of user]**, I want **[feature or action]** so that **[benefit or reason]**."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What the user should be able to do.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Each one must be something you can check. At least three.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [High, Medium, Low]
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: Story points
      options: ["1", "2", "3", "5", "8"]
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: Issue numbers this story depends on, or None.
      placeholder: "None"
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Mockups, references or restrictions.
  - type: markdown
    attributes:
      value: "After creating: set the milestone (sprint), assign the people working on it, and add it to the board."
