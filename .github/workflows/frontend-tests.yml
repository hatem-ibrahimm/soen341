# Frontend CI: every push and pull request is checked automatically by GitHub.
# It installs the frontend, then runs, in order:
#   1. npm run lint            -> code style / common mistakes (oxlint)
#   2. npm run test:unit       -> unit tests in frontend/tests/unit (Vitest)
#   3. npm run test:acceptance -> acceptance tests in frontend/tests/acceptance (Vitest)
#   4. npm run build           -> makes sure the app still builds for production
# If any step fails, the run gets a red ❌ and the PR shows the check as failed.

name: Frontend Tests

on:
  push:
    # Any branch, but only when frontend code (or this file) changed.
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"

  pull_request:
    # Every PR into develop or main is checked, so it can be a required check.
    branches:
      - develop
      - main

# If you push again while a run is still going, cancel the old run.
concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run acceptance tests
        run: npm run test:acceptance

      - name: Build
        run: npm run build
